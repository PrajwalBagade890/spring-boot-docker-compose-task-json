spring.application.name=spring-boot-docker-compose-task
server.port=8080

# Defaults allow running the app directly on the host when MySQL is available locally.
# Docker Compose overrides these values with the db service hostname.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/springdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
